    var path = href.slice(0, qi);
    var parts = href.slice(qi + 1).split("&");
    var kept = [];
    var had = false;
    for (var i = 0; i < parts.length; i++) {
      if (!parts[i]) continue;
      var eq = parts[i].indexOf("=");
      var key = eq < 0 ? parts[i] : parts[i].slice(0, eq);
      try {

      }
      kept.push(parts[i]);
