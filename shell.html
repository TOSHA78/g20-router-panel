<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7">
<link rel="icon" href="data:,">
<title>Роутер g20</title>
<style>
:root{--bg:var(--tg-theme-secondary-bg-color,#f2f2f7);--card:var(--tg-theme-section-bg-color,var(--tg-theme-bg-color,#fff));--tx:var(--tg-theme-text-color,#000);--hint:var(--tg-theme-hint-color,#8e8e93);--acc:var(--tg-theme-button-color,#2481cc);--acctx:var(--tg-theme-button-text-color,#fff);--hdr:var(--tg-theme-section-header-text-color,var(--hint));--red:var(--tg-theme-destructive-text-color,#e53935);--sep:rgba(127,127,127,.18);--acc-soft:rgba(36,129,204,.12);--safe-t:calc(var(--tg-content-safe-area-inset-top,0px) + var(--tg-safe-area-inset-top,0px));--safe-r:calc(var(--tg-content-safe-area-inset-right,0px) + var(--tg-safe-area-inset-right,0px));--safe-b:calc(var(--tg-content-safe-area-inset-bottom,0px) + var(--tg-safe-area-inset-bottom,0px));--safe-l:calc(var(--tg-content-safe-area-inset-left,0px) + var(--tg-safe-area-inset-left,0px))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:calc(12px + var(--safe-t)) calc(12px + var(--safe-r)) calc(28px + var(--safe-b)) calc(12px + var(--safe-l));min-height:var(--tg-viewport-stable-height,100vh);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
h2{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--hdr);margin:18px 6px 6px}
.card{background:var(--card);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:12px 14px;min-height:48px}
.row+.row{border-top:1px solid var(--sep)}
.row .t{flex:1;min-width:0}.row .s{color:var(--hint);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.t .s.wrap{white-space:normal}
.ed .s{flex:1 1 100%;color:var(--hint);font-size:13px}
.ic{font-size:20px;width:26px;text-align:center;flex:none}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--card);border-radius:14px;padding:12px}
.tile .k{color:var(--hint);font-size:12px}.tile .v{font-size:17px;font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw{position:relative;width:51px;height:31px;flex:none}
.sw input{position:absolute;top:0;right:0;bottom:0;left:0;margin:0;opacity:0;cursor:pointer}
.sw span{position:absolute;top:0;right:0;bottom:0;left:0;border-radius:31px;background:var(--sep);transition:.2s}
.sw span:before{content:"";position:absolute;width:27px;height:27px;left:2px;top:2px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:.2s}
.sw input:checked+span{background:#34c759}.sw input:checked+span:before{transform:translateX(20px)}
.sw input:focus-visible+span,.row:focus-visible,.btn:focus-visible,.ed button:focus-visible,.ed input:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
.srv{cursor:pointer}.srv.on{background:var(--acc-soft)}
.srv .chk{display:inline-block;color:var(--acc);font-weight:700;width:18px;text-align:center;flex:none}
.ping{font-size:13px;color:var(--hint);font-variant-numeric:tabular-nums;flex:none}.ping.ok{color:#34c759}.ping.mid{color:#ff9500}.ping.bad{color:var(--red)}
.srv.dead .t{opacity:.45}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:13px;min-height:48px;font:600 15px/1.2 inherit;background:var(--card);color:var(--acc);cursor:pointer}
.btn.red{color:var(--red)}.btn+.btn{margin-top:8px}
.btn:disabled{opacity:.55;cursor:default}
.foot{color:var(--hint);font-size:12px;text-align:center;margin-top:14px}
.badge{display:inline-block;font-size:11px;padding:2px 7px;border-radius:8px;background:var(--sep);color:var(--hint);margin-left:6px;vertical-align:middle}
.dev{cursor:pointer}.dev.off .t{opacity:.5}.dev .bl{color:var(--red);font-size:12px;font-weight:600}
.dev.static{cursor:default}
.ed{display:none;padding:0 14px 12px 50px;gap:8px;flex-wrap:wrap}.ed.open{display:flex}
.ed input{flex:1 1 100%;font:inherit;font-size:16px;color:var(--tx);background:var(--bg);border:1px solid var(--sep);border-radius:10px;padding:10px;min-height:44px}
.ed button{flex:1;border:0;border-radius:10px;padding:10px;min-height:44px;font:600 14px/1.2 inherit;background:var(--acc);color:var(--acctx);cursor:pointer}
.ed button.red{background:var(--red);color:#fff}.ed button.grn{background:#34c759;color:#fff}
.err{padding:30px 16px;text-align:center;color:var(--hint)}
.err .icon{font-size:44px;line-height:1.2}
.note{margin:0 0 10px;padding:10px 12px;border-radius:12px;background:var(--card);color:var(--tx);font-size:13px;line-height:1.35}
.note.warn{box-shadow:inset 3px 0 0 #ff9500}
.toast{position:fixed;z-index:5;left:calc(12px + var(--safe-l));right:calc(12px + var(--safe-r));bottom:calc(12px + var(--safe-b));padding:12px 14px;border-radius:14px;background:var(--tx);color:var(--bg);font-size:14px;line-height:1.35;box-shadow:0 8px 24px rgba(0,0,0,.18);opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:none}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
#app[aria-busy="true"]{pointer-events:none}
@media (prefers-reduced-motion:reduce){
  .sw span,.sw span:before,.toast{transition:none}
}
</style>
</head>
<body>
<div id="app" data-booted="0"><div class="err"><div class="icon">🛜</div><p><b>Загрузка панели…</b></p></div></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<noscript><div class="err"><p><b>Нужен JavaScript.</b></p><p>Откройте панель в Telegram.</p></div></noscript>
<script>
(function () {
  window.__g20timer = setTimeout(function () {
    var app = document.getElementById("app");
    if (!app || app.getAttribute("data-booted") === "1") return;
    app.innerHTML = '<div class="err"><div class="icon">⚠️</div><p><b>Страница загружается слишком долго</b></p><p>Проверьте интернет, закройте окно и откройте панель ещё раз.</p></div><button class="btn" type="button" id="reload">Повторить</button>';
    var b = document.getElementById("reload");
    if (b) b.onclick = function () { location.reload(); };
  }, 12000);
})();
</script>
<script src="tg.js?v=6" onerror="window.__tgFailed=1"></script>
<script>
/*__PANEL_SRC__*/
</script>
</body>
</html>
