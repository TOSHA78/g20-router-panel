.sw{position:relative;width:51px;height:31px;flex:none}
.sw input{display:none}.sw span{position:absolute;inset:0;border-radius:31px;background:var(--sep);transition:.2s}
.sw span:before{content:"";position:absolute;width:27px;height:27px;left:2px;top:2px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:.2s}

.srv.dead .t{opacity:.45}

.foot{color:var(--hint);font-size:12px;text-align:center;margin-top:14px}
.badge{display:inline-block;font-size:11px;padding:2px 7px;border-radius:8px;background:var(--sep);color:var(--hint);margin-left:6px;vertical-align:middle}

.ed button{flex:1;border:0;border-radius:10px;padding:10px;font:600 14px inherit;font-family:inherit;background:var(--acc);color:var(--acctx)}
.ed button.red{background:var(--red);color:#fff}.ed button.grn{background:#34c759;color:#fff}
.err{padding:30px 16px;text-align:center;color:var(--hint)}
</style>

        const [nm, oct, , mac, fl, sig] = d, on = fl & 1, bl = fl & 2;
        const macF = mac.match(/../g).join(":");
        h += '<div class="row dev '.concat(on ? "" : "off", '" data-m="').concat(esc(mac), '"><span class="ic">').concat(nk === "h" ? "\u{1F4A1}" : nk === "g" ? "\u{1F464}" : "\u{1F4F1}", '</span>\n        <div class="t">').concat(esc(nm || "\u0411\u0435\u0437 \u0438\u043C\u0435\u043D\u0438"), " ").concat(bl ? '<span class="bl">\xB7 \u0431\u0435\u0437 \u0438\u043D\u0442\u0435\u0440\u043D\u0435\u0442\u0430</span>' : "", '<div class="s">').concat(subnet[nk]).concat(oct, " \xB7 ").concat(on ? sig ? sig + " dBm" : "\u043F\u043E \u043A\u0430\u0431\u0435\u043B\u044E" : "\u043D\u0435 \u0432 \u0441\u0435\u0442\u0438", '</div></div><span class="s">\u203A</span></div>\n        <div class="ed" id="ed-').concat(esc(mac), '"><input maxlength="24" placeholder="\u0418\u043C\u044F \u0443\u0441\u0442\u0440\u043E\u0439\u0441\u0442\u0432\u0430" value="').concat(esc(nm), '" id="in-').concat(esc(mac), '">\n        <div class="s" style="flex:1 1 100%">MAC ').concat(macF, '</div>\n        <button data-act="ren" data-m="').concat(esc(mac), '">\u0421\u043E\u0445\u0440\u0430\u043D\u0438\u0442\u044C \u0438\u043C\u044F</button>\n        <button class="').concat(bl ? "grn" : "red", '" data-act="blk" data-v="').concat(bl ? 0 : 1, '" data-m="').concat(esc(mac), '">').concat(bl ? "\u0420\u0430\u0437\u0431\u043B\u043E\u043A\u0438\u0440\u043E\u0432\u0430\u0442\u044C" : "\u0411\u043B\u043E\u043A \u0438\u043D\u0442\u0435\u0440\u043D\u0435\u0442\u0430", "</button></div>");
      }
      if (hidden) h += '<div class="row"><span class="ic">\u{1F4A1}</span><div class="t">\u0415\u0449\u0451 '.concat(hidden, ' \u0443\u0441\u0442\u0440\u043E\u0439\u0441\u0442\u0432 \u0443\u043C\u043D\u043E\u0433\u043E \u0434\u043E\u043C\u0430<div class="s">\u0441\u043A\u0440\u044B\u0442\u043E, \u0447\u0442\u043E\u0431\u044B \u0441\u0441\u044B\u043B\u043A\u0430 \u0432\u043B\u0435\u0437\u043B\u0430</div></div></div>');
      h += "</div>";
    }
    if (S.co) h += '<div class="foot">\u041D\u0435 \u0432 \u0441\u0435\u0442\u0438 \u0438 \u0441\u043A\u0440\u044B\u0442\u043E: '.concat(S.co, "</div>");
    h += '<h2>\u0421\u0435\u0442\u044C</h2><div class="card">\n    <div class="row"><span class="ic">\u{1F310}</span><div class="t">\u0412\u043D\u0435\u0448\u043D\u0438\u0439 IP<div class="s">WAN '.concat(esc(S.w), '</div></div><span class="s">').concat(esc(S.e), "</span></div></div>");
    h += '<h2>\u0414\u0435\u0439\u0441\u0442\u0432\u0438\u044F</h2><button class="btn" id="speed">\u{1F4F6} \u0422\u0435\u0441\u0442 \u0441\u043A\u043E\u0440\u043E\u0441\u0442\u0438</button><button class="btn" id="report">\u{1F4CB} \u041E\u0442\u0447\u0451\u0442 \u0437\u0430 \u0441\u0443\u0442\u043A\u0438</button><button class="btn" id="refresh">\u{1F504} \u041E\u0431\u043D\u043E\u0432\u0438\u0442\u044C \u0434\u0430\u043D\u043D\u044B\u0435</button><button class="btn red" id="reboot">\u23FB \u041F\u0435\u0440\u0435\u0437\u0430\u0433\u0440\u0443\u0437\u0438\u0442\u044C \u0440\u043E\u0443\u0442\u0435\u0440</button>';
    h += '<div class="foot">\u0414\u0430\u043D\u043D\u044B\u0435: '.concat(agoTxt, " \xB7 \u0438\u0437\u043C\u0435\u043D\u0435\u043D\u0438\u044F \u043F\u0440\u0438\u043C\u0435\u043D\u044F\u0435\u0442 \u0431\u043E\u0442 \xB7 ").concat(PANEL_VER, "</div>");
    app.innerHTML = h;
    document.getElementById("vpn").onchange = (e) => {
      hap();
      e.target.checked ? send({ a: "vpn", v: 1 }) : confirmDo("\u0412\u044B\u043A\u043B\u044E\u0447\u0438\u0442\u044C VPN? \u0417\u0430\u0431\u043B\u043E\u043A\u0438\u0440\u043E\u0432\u0430\u043D\u043D\u044B\u0435 \u0441\u0430\u0439\u0442\u044B \u043F\u0435\u0440\u0435\u0441\u0442\u0430\u043D\u0443\u0442 \u043E\u0442\u043A\u0440\u044B\u0432\u0430\u0442\u044C\u0441\u044F.", { a: "vpn", v: 0 }) || (e.target.checked = true);
    };
    document.getElementById("guest").onchange = (e) => {
      hap();
      send({ a: "guest", v: e.target.checked ? 1 : 0 });
    };
    document.getElementById("refresh").onclick = () => {
      hap();
      send({ a: "refresh" });
    };
    document.getElementById("speed").onclick = () => {
      hap();
      send({ a: "speed" });
    };
    document.getElementById("report").onclick = () => {
      hap();
      send({ a: "report" });
    };
    document.querySelectorAll(".dev").forEach((el) => el.onclick = () => {
      hap();
      const e = document.getElementById("ed-" + el.dataset.m);
      e && e.classList.toggle("open");
    });
    document.querySelectorAll(".ed button").forEach((b) => b.onclick = (ev) => {
      ev.stopPropagation();
      const m = b.dataset.m;
      if (b.dataset.act === "ren") {
        const n = (document.getElementById("in-" + m).value || "").trim().slice(0, 24);
        send({ a: "ren", m, n });
      } else {
        const v = +b.dataset.v;
        v ? confirmDo("\u041E\u0442\u043A\u043B\u044E\u0447\u0438\u0442\u044C \u0438\u043D\u0442\u0435\u0440\u043D\u0435\u0442 \u044D\u0442\u043E\u043C\u0443 \u0443\u0441\u0442\u0440\u043E\u0439\u0441\u0442\u0432\u0443? \u041B\u043E\u043A\u0430\u043B\u044C\u043D\u0430\u044F \u0441\u0435\u0442\u044C \u043E\u0441\u0442\u0430\u043D\u0435\u0442\u0441\u044F.", { a: "blk", m, v }) : send({ a: "blk", m, v });
      }
    });
    document.getElementById("reboot").onclick = () => confirmDo("\u041F\u0435\u0440\u0435\u0437\u0430\u0433\u0440\u0443\u0437\u0438\u0442\u044C \u0440\u043E\u0443\u0442\u0435\u0440? \u0418\u043D\u0442\u0435\u0440\u043D\u0435\u0442 \u043F\u0440\u043E\u043F\u0430\u0434\u0451\u0442 \u043F\u0440\u0438\u043C\u0435\u0440\u043D\u043E \u043D\u0430 2 \u043C\u0438\u043D\u0443\u0442\u044B.", { a: "reboot" });
    document.querySelectorAll(".srv").forEach((el) => el.onclick = () => {
      hap();
      const t = el.dataset.t;
      if (t === "AUTO" && S.sel === "AUTO" || t === S.sel) return;
      send({ a: "sel", t });
    });
  }
  render();
}
try {
  boot();
} catch (e) {
  showFatal((e && e.message) + (e && e.stack ? " | " + String(e.stack).slice(0, 300) : ""));
}
</script>
</body>
</html>
